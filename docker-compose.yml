services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: file:./dev.db
      APP_ACCESS_USERNAME: ${APP_ACCESS_USERNAME:?Set APP_ACCESS_USERNAME in .env}
      APP_ACCESS_PASSWORD: ${APP_ACCESS_PASSWORD:?Set APP_ACCESS_PASSWORD in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
    volumes:
      - task_manager_data:/app/prisma
    restart: unless-stopped

volumes:
  task_manager_data:
